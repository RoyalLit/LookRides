<!DOCTYPE html>
<html>
<head>
<style>
  body {
    background: linear-gradient(to right, red, blue);
    height: 200vh;
    margin: 0;
  }
  .header {
    position: sticky;
    top: 50px;
    z-index: 100;
    padding: 20px;
    border: 1px solid black;
  }
  .header::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: -1;
    background-color: rgba(255, 255, 255, 0.8);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .logo {
    width: 100px;
    height: 100px;
    background-color: white; /* Simulating white image background */
    mix-blend-mode: multiply;
  }
  .dot {
    width: 50px; height: 50px; background: black; border-radius: 50%;
  }
</style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <div class="dot"></div>
    </div>
  </div>
</body>
</html>
